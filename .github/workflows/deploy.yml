name: Build and deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows one deployment at a time. cancel-in-progress would kill a build
# that is already running whenever another push lands, so a run of quick commits
# could leave the site stuck on an old bundle. Queue them instead — each push
# still deploys, just in order.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Build (Supabase publishable key is public-safe; data is protected by login + RLS)
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://lkcfbgnuodqzvowschjn.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_t3vO3q1Y7PRH3qVp_64dfg_L4Zr1fIT
          BASE_PATH: /Inventory-Management/
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
